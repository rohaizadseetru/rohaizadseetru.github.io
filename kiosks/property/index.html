<!doctype html>

<head>
<meta charset="utf-8">

<title>MRT Corp · Property · TXA 2026</title>
<style>
/* ===== Shared kiosk design system ===== */

:root{
  --navy:#07254F; --navy2:#0D4386; --deep:#041A3A;
  --blue:#2771CC; --red:#E42132; --teal:#269C95; --yellow:#F6B700;
  --ice:#EFF5FB; --ice2:#E4EEF8; --white:#fff;
  --glass:rgba(255,255,255,.07); --glass2:rgba(255,255,255,.12); --line:rgba(255,255,255,.14);
  --font:"Segoe UI Variable Display","Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:var(--font);color:#fff;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;overscroll-behavior:none}
body.nocursor, body.nocursor *{cursor:none!important}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer;touch-action:manipulation}
img{-webkit-user-drag:none;user-drag:none}

/* ---------- fixed 1920x1080 stage, scaled to any screen ---------- */
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center;overflow:hidden;
  background:radial-gradient(1200px 800px at 80% -10%,#0D4386 0%,transparent 60%),radial-gradient(900px 700px at -10% 110%,#0b3470 0%,transparent 55%),var(--navy)}
.screen{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease,visibility 0s .45s}
.screen.active{opacity:1;visibility:visible;transition:opacity .45s ease}

/* animated line background (shared) */
#bgLines{position:absolute;inset:0;opacity:.3;pointer-events:none}
#bgLines path{fill:none;stroke-width:6;stroke-linecap:round;stroke-dasharray:14 26;animation:flow 6s linear infinite}
#bgLines path:nth-child(2){animation-duration:8s}#bgLines path:nth-child(3){animation-duration:7s}#bgLines path:nth-child(4){animation-duration:9s}
@keyframes flow{to{stroke-dashoffset:-400}}
.grid{position:absolute;inset:0;pointer-events:none;opacity:.35;
  background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:60px 60px}

/* top bar */
.topbar{position:absolute;left:0;right:0;top:0;height:110px;display:flex;align-items:center;justify-content:space-between;padding:0 64px;z-index:5}
.brand{display:flex;align-items:center;gap:22px}
.brand img{height:130px}
.wordmark{font-weight:800;font-size:34px;letter-spacing:.06em}
.wordmark b{color:var(--red)}
.brand .tag{font-size:20px;letter-spacing:.18em;opacity:.75;border-left:2px solid var(--line);padding-left:22px;text-transform:uppercase}
.navbtns{display:flex;gap:18px}
.iconbtn{height:76px;min-width:76px;padding:0 26px;border-radius:40px;background:var(--glass2);border:1.5px solid var(--line);display:flex;align-items:center;gap:12px;font-size:24px;font-weight:600;transition:transform .15s,background .2s}
.iconbtn:active{transform:scale(.94);background:rgba(255,255,255,.22)}
.iconbtn svg{width:32px;height:32px}

.footer{position:absolute;left:0;right:0;bottom:0;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 64px;font-size:19px;opacity:.7;letter-spacing:.04em;z-index:4}
.linebar{position:absolute;left:0;right:0;bottom:64px;height:6px;display:flex;z-index:4}
.linebar i{flex:1}

svg.ic{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- ATTRACT ---------- */
#attract{background:#000}
#attract video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#attractFallback{position:absolute;inset:0;display:none;background:radial-gradient(1400px 900px at 70% 30%,#0D4386,var(--deep))}
#attract.novideo #attractFallback{display:block}
#attract.novideo video{display:none}
#attractFallback svg path{fill:none;stroke-width:14;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:3000;stroke-dashoffset:3000;animation:draw 5s ease forwards, glow 4s ease-in-out 5s infinite alternate}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes glow{from{opacity:.85}to{opacity:.45}}
.fbHead{position:absolute;left:120px;top:250px;max-width:1100px}
.fbHead .k{font-size:28px;letter-spacing:.3em;text-transform:uppercase;color:var(--yellow);font-weight:700;margin-bottom:24px}
.fbHead h1{font-size:132px;line-height:.98;font-weight:800;letter-spacing:-.02em}
.fbHead h1 span{color:var(--red)}
.fbHead p{font-size:40px;margin-top:28px;opacity:.85}
.shade{position:absolute;inset:0;background:linear-gradient(0deg,rgba(4,26,58,.85) 0%,rgba(4,26,58,0) 38%),linear-gradient(180deg,rgba(4,26,58,.6) 0%,rgba(4,26,58,0) 18%);pointer-events:none}

@keyframes pop{0%{transform:translateY(30px);opacity:0}100%{transform:none;opacity:1}}
.fab{position:absolute;right:90px;bottom:80px;display:flex;align-items:center;gap:26px;height:150px;padding:0 64px 0 44px;border-radius:80px;
  background:linear-gradient(135deg,#ff3446,var(--red));box-shadow:0 20px 60px rgba(228,33,50,.55);font-size:46px;font-weight:800;letter-spacing:.02em;animation:bob 3s ease-in-out infinite}
.fab svg{width:72px;height:72px;stroke-width:1.6}
.fab::before,.fab::after{content:"";position:absolute;inset:0;border-radius:80px;border:4px solid rgba(228,33,50,.8);animation:ring 2.4s ease-out infinite}
.fab::after{animation-delay:1.2s}
@keyframes ring{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.35,1.6);opacity:0}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.fab small{display:block;font-size:22px;font-weight:500;opacity:.9;letter-spacing:.06em;margin-top:2px}

/* ---------- HUB ---------- */
.hero-title{position:absolute;left:0;right:0;top:170px;text-align:center}
.eyebrow{font-size:24px;letter-spacing:.3em;text-transform:uppercase;color:var(--yellow);font-weight:700}
.hero-title h2{font-size:84px;font-weight:800;letter-spacing:-.01em;margin-top:16px}
.hero-title p{font-size:32px;opacity:.8;margin-top:0}
.journeys{position:absolute;left:0;right:0;top:420px;display:flex;justify-content:center;gap:60px}
.journey{width:760px;height:500px;border-radius:40px;padding:56px;text-align:left;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:flex-start;
  background:linear-gradient(160deg,rgba(255,255,255,.13),rgba(255,255,255,.04));border:1.5px solid var(--line);
  box-shadow:0 30px 80px rgba(0,0,0,.35);transition:transform .2s;animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.journey:nth-child(2){animation-delay:.12s}
.journey:active{transform:scale(.97)}
@keyframes rise{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
.journey .jic{width:120px;height:120px;border-radius:32px;display:grid;place-items:center;background:var(--c)}
.journey .jic svg{width:70px;height:70px;stroke-width:1.6}
.journey h3{font-size:56px;font-weight:800;margin-top:34px;line-height:1.05}
.journey p{font-size:28px;opacity:.8;margin-top:16px}
.journey .go{margin-top:auto;height:96px;padding:0 44px;border-radius:50px;background:var(--c);display:flex;align-items:center;gap:14px;font-size:32px;font-weight:800}
.journey .go svg{width:36px;height:36px;stroke-width:2.4}
.journey .bigring{position:absolute;right:-120px;top:-120px;width:420px;height:420px;border-radius:50%;border:40px solid var(--c);opacity:.14}

/* ---------- QUIZ ---------- */
.rail{position:absolute;left:260px;right:260px;top:150px;height:120px}
.rail .track{position:absolute;left:40px;right:40px;top:38px;height:10px;border-radius:6px;background:rgba(255,255,255,.14)}
.rail .fill{position:absolute;left:40px;top:38px;height:10px;border-radius:6px;background:linear-gradient(90deg,var(--blue),var(--red),var(--yellow),var(--teal));transition:width .7s cubic-bezier(.4,0,.2,1)}
.rail .stn{position:absolute;top:0;width:86px;margin-left:-43px;text-align:center}
.rail .dot{width:86px;height:86px;border-radius:50%;border:6px solid rgba(255,255,255,.25);background:var(--navy);display:grid;place-items:center;font-size:32px;font-weight:800;transition:all .4s}
.rail .lbl{font-size:22px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-top:12px;opacity:.55;white-space:nowrap;margin-left:-60px;margin-right:-60px}
.rail .stn.done .dot{border-color:var(--sc)}
/* .rail .stn.done .dot{background:var(--sc);border-color:var(--sc)} */
.rail .stn.cur .dot{border-color:var(--sc);box-shadow:0 0 0 12px color-mix(in srgb,var(--sc) 30%,transparent);transform:scale(1.1)}
.rail .stn.cur .lbl,.rail .stn.done .lbl{opacity:1}

@keyframes fadeup{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}

@keyframes pulse{50%{transform:scale(1.25)}}

.btn{height:110px;border-radius:60px;font-size:34px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:16px;transition:transform .15s;letter-spacing:.03em}
.btn:active{transform:scale(.96)}
.btn svg{width:40px;height:40px;stroke-width:2.4}
.btn.primary{background:var(--red);box-shadow:0 18px 44px rgba(228,33,50,.4)}
.btn.ghost{background:transparent;border:2.5px solid rgba(255,255,255,.55)}

#map{position:absolute;left:80px;top:330px;width:1760px;height:600px}
#map > svg{position:absolute;inset:0;overflow:visible}
#map svg .ln{fill:none;stroke-width:22;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:4000;stroke-dashoffset:4000}
#explore.active #map svg .ln{animation:draw 2.2s ease forwards}
#map svg .train{opacity:0}
#explore.active #map svg .train{animation:show .3s 2.2s forwards}
@keyframes show{to{opacity:1}}

/* detail panel */
#scrim{position:absolute;inset:0;background:rgba(2,14,34,.6);opacity:0;visibility:hidden;transition:opacity .35s,visibility 0s .35s;z-index:20}
#scrim.on{opacity:1;visibility:visible;transition:opacity .35s}
#panel{position:absolute;right:0;top:0;bottom:0;width:1240px;background:linear-gradient(180deg,#0a2e5e,#061d42);z-index:21;transform:translateX(105%);transition:transform .55s cubic-bezier(.2,.8,.2,1);box-shadow:-40px 0 100px rgba(0,0,0,.5);overflow:hidden}
#panel.on{transform:none}

@keyframes floaty{50%{transform:translateY(-14px) rotate(-3deg)}}

.chip{display:inline-flex;align-items:center;gap:10px;padding:8px 20px;border-radius:30px;background:rgba(255,255,255,.18);font-size:18px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.chip i{width:26px;height:10px;border-radius:5px;background:var(--pc);outline:2px solid #fff}

.pclose{position:absolute;right:36px;top:36px;z-index:3;width:90px;height:90px;border-radius:50%;background:rgba(4,26,58,.6);border:2px solid rgba(255,255,255,.4);display:grid;place-items:center}
.pclose svg{width:40px;height:40px;stroke-width:2.4}

.lead{margin-top:30px;font-size:22px;opacity:.75}
.lead b{opacity:1;color:#fff}

/* wipe transition */
#wipe{position:absolute;inset:0;z-index:50;pointer-events:none;display:flex;flex-direction:column}
#wipe i{flex:1;transform:translateX(-102%)}
#wipe.run i{animation:wipe .95s cubic-bezier(.7,0,.3,1) forwards}
#wipe.run i:nth-child(2){animation-delay:.05s}#wipe.run i:nth-child(3){animation-delay:.1s}#wipe.run i:nth-child(4){animation-delay:.15s}
@keyframes wipe{0%{transform:translateX(-102%)}45%,55%{transform:translateX(0)}100%{transform:translateX(102%)}}

/* idle overlay */
#idle{position:absolute;inset:0;z-index:60;background:rgba(2,14,34,.8);display:grid;place-items:center;opacity:0;visibility:hidden;transition:opacity .3s}
#idle.on{opacity:1;visibility:visible}
#idle .box{text-align:center}
#idle .num{font-size:180px;font-weight:800;color:var(--yellow);line-height:1}
#idle h3{font-size:56px;font-weight:800;margin-top:10px}
#idle p{font-size:30px;opacity:.8;margin-top:14px}

/* admin */
#hot{position:absolute;left:0;top:0;width:90px;height:90px;z-index:70}
#admin{position:absolute;inset:80px;z-index:80;background:#fff;color:#0b1f3f;border-radius:24px;padding:40px 50px;display:none;font-size:22px;overflow:auto}
#admin.on{display:block}
#admin h3{font-size:34px;margin-bottom:16px}
#admin table{border-collapse:collapse;margin:10px 0 24px}
#admin td,#admin th{border:1px solid #cdd8e6;padding:8px 14px;text-align:left}
#admin .warn{color:#b3141f;font-weight:700}
#admin .ok{color:#1c7d52;font-weight:700}
#admin button{background:#07254F;color:#fff;padding:14px 26px;border-radius:10px;font-size:22px;margin-right:12px}

/* ===== Procurement-specific components ===== */
.journeys.four{gap:36px;top:370px}
.journeys.four .journey{width:410px;height:550px;padding:40px 38px}
.journeys.four .journey h3{font-size:42px;margin-top:28px}
.journeys.four .journey p{font-size:23px;line-height:1.35}
.journeys.four .journey .jic{width:104px;height:104px;border-radius:28px}
.journeys.four .journey .jic svg{width:60px;height:60px}
.journeys.four .journey .go{height:64px;padding:0 36px;font-size:28px}
.journeys.four .journey:nth-child(3){animation-delay:.24s}.journeys.four .journey:nth-child(4){animation-delay:.36s}

/* journey viewer */
#jRail{position:absolute;left:220px;right:220px;top:140px;height:120px}
#jRail .stn{cursor:pointer}

#jArea{position:absolute;left:120px;right:120px;top:300px;height:560px}
.sl{position:absolute;inset:0;animation:fadeup .5s ease both}
.sl.back{animation-name:fadedown}
@keyframes fadedown{from{opacity:0;transform:translateY(-24px)}to{opacity:1;transform:none}}

.sl h2{font-size:50px;font-weight:800;line-height:1.08;margin-top:8px;letter-spacing:-.01em}
.sl .lead{font-size:26px;opacity:.88;line-height:1.4;margin-top:14px;max-width:1500px}

.note{font-size:21px;opacity:.65;margin-top:18px;font-style:italic}

.lc{flex:1;border-radius:30px;padding:26px 28px 22px;background:linear-gradient(160deg,rgba(255,255,255,.14),rgba(255,255,255,.04));border:1.5px solid var(--line);position:relative;overflow:hidden;animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.lc:nth-child(2){animation-delay:.1s}.lc:nth-child(3){animation-delay:.2s}.lc:nth-child(4){animation-delay:.3s}
.lc::before{content:"";position:absolute;left:0;right:0;top:0;height:12px;background:var(--lcc)}

.lc .sub{font-size:24px;opacity:.8;margin-top:8px}

.lc .bar{height:14px;border-radius:8px;background:rgba(255,255,255,.14);margin-top:20px;position:relative;overflow:visible}
.lc .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:8px;background:var(--lcc);width:0;transition:width 1.4s cubic-bezier(.2,.8,.2,1) .5s}
.lc .bar u{position:absolute;top:-8px;bottom:-8px;width:4px;background:#fff;border-radius:2px}

/* process + grade picker */
.flow{display:flex;align-items:center;gap:0;margin-top:26px}
.flow .f{padding:18px 34px;border-radius:18px;font-size:28px;font-weight:800;background:var(--glass2);border:1.5px solid var(--line)}
.flow .f.on{background:var(--jc);border-color:var(--jc)}

.step{display:flex;gap:20px;align-items:flex-start;font-size:22px;line-height:1.35;animation:fadeup .45s ease both}
.step:nth-child(2){animation-delay:.1s}.step:nth-child(3){animation-delay:.2s}
.step b.n{flex:0 0 48px;height:48px;border-radius:50%;background:var(--gc);display:grid;place-items:center;font-size:22px}
.step strong{display:block;font-size:25px}

.tab{height:80px;padding:0 34px;border-radius:40px;font-size:26px;font-weight:800;background:var(--glass2);border:1.5px solid var(--line)}
.tab.sel{background:var(--jc);border-color:var(--jc)}
.tab b{display:inline-grid;place-items:center;min-width:40px;height:40px;border-radius:20px;background:rgba(255,255,255,.25);margin-left:10px;font-size:20px}

.logo{height:150px;border-radius:24px;background:#fff;display:grid;place-items:center;padding:22px 30px;animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
.logo img{max-width:100%;max-height:100%;object-fit:contain}

/* journey nav */
.jnav{position:absolute;left:120px;right:120px;bottom:100px;display:flex;justify-content:space-between;align-items:center}
.jnav .btn{width:380px;height:100px;font-size:30px}
.jnav .btn[disabled]{opacity:.25;pointer-events:none}
.jnav .dots{font-size:22px;letter-spacing:.2em;opacity:.7;font-weight:700;text-align:center;}
.swipehint{font-size:20px;opacity:.55;letter-spacing:.1em;margin-top:6px;text-align:center}

#player{position:absolute;inset:0;z-index:40;background:#000;display:none}
#player.on{display:block}
#player video{width:100%;height:100%;object-fit:contain;background:#000}
#player .pclose{position:absolute;right:40px;top:40px;z-index:2}
#player .soon{position:absolute;inset:0;display:none;place-items:center;text-align:center;background:var(--navy)}
#player.missing .soon{display:grid}
#player .soon h3{font-size:64px;font-weight:800}
#player .soon p{font-size:30px;opacity:.8;margin-top:14px}

  background: linear-gradient(135deg, #e42132ba); box-shadow: 0 20px 60px rgba(228, 33, 50, .55); font-size: 36px; font-weight: 800; letter-spacing: .02em; animation: bob 3s ease-in-out infinite; z-index: 3;

  width: 72px;
  height: 72px;
  stroke-width: 1.6;
  fill: none;
  stroke: currentColor;
  overflow: visible;
  transform-origin: 70% 80%;
  /* Slowed down to 3.5s for a smooth, relaxed rhythm */
  animation: clickTap 2.5s ease-in-out infinite; 
}

/* Slow & deliberate click motion */
@keyframes clickTap {
  0%, 35%, 100% {
    transform: scale(1) rotate(0deg) translate(0, 0);
  }
  48% {
    /* Gentle press down */
    transform: scale(0.85) rotate(-10deg) translate(-2px, 4px);
  }
  60% {
    /* Smooth bounce release */
    transform: scale(1.03) rotate(2deg) translate(0, -1px);
  }
  70% {
    transform: scale(1) rotate(0deg) translate(0, 0);
  }
}

/* ===================== Property kiosk additions ===================== */
.fbHead h1{font-size:120px}

/* Carousel Styles */
/* 1. Force block display so .dd-img's grid layout doesn't break track sizing */
.dd-carousel {
  display: block !important;
  position: absolute;
  left: 120px;
  top: 150px;
  width: 660px;
  height: 680px;
  border-radius: 32px;
  background: #fff;
  overflow: hidden;
  box-shadow: 0 30px 80px rgba(0,0,0,.35);
}

/* 2. Lock track to exactly 100% (660px) so translateX(-100%) moves 1 slide */
.dd-carousel-track {
  display: flex;
  width: 100%;
  height: 100%;
  transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
  will-change: transform;
}

.dd-carousel-slide {
  flex: 0 0 100%;
  width: 100%;
  min-width: 100%;
  height: 100%;
  position: relative;
}

.dd-carousel-slide img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

/* 3. Button and SVG pointer fixes */
.dd-carousel-btn {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background: rgba(4, 26, 58, 0.7);
  border: 1px solid rgba(255,255,255,0.3);
  width: 56px;
  height: 56px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  cursor: pointer;
  z-index: 10;                     /* Ensures buttons stay above slides */
  transition: background 0.2s, transform 0.2s;
}

.dd-carousel-btn:active {
  transform: translateY(-50%) scale(0.92);
  background: var(--red);
}

/* Prevents SVG paths from swallowing touch/click events */
.dd-carousel-btn svg {
  width: 30px;
  height: 30px;
  stroke-width: 2.4;
  stroke: #fff;
  fill: none;
  pointer-events: none;
}

.dd-carousel-prev { left: 16px; }
.dd-carousel-next { right: 16px; }

/* If your next button uses ic('back'), keep rotate(180deg). 
   If it uses ic('arrow'), remove the rotation so it points right. */
.dd-carousel-next svg {
  transform: rotate(180deg);
}

.dd-carousel-dots {
  position: absolute;
  bottom: 20px;
  left: 0;
  right: 0;
  display: flex;
  justify-content: center;
  gap: 10px;
  z-index: 10;
}

.dd-carousel-dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: rgba(255,255,255,0.4);
  cursor: pointer;
  transition: all 0.3s;
}

.dd-carousel-dot.active {
  background: #fff;
  width: 28px;
  border-radius: 6px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.3);
}

.qrph{color:var(--navy);text-align:center;font-size:20px;font-weight:700;line-height:1.35;border:4px dashed #9bb3d1;border-radius:16px;width:100%;height:100%;display:grid;place-items:center;padding:14px;word-break:break-all}
.ct-card h3{font-size:40px;font-weight:800;margin-top:30px}
.ct-card p{font-size:24px;opacity:.8;margin-top:8px}
.ct-actions{position:absolute;left:120px;top:860px;display:flex;gap:30px}
.ct-actions .btn{width:520px;height:96px;font-size:30px}
.ctbtn{position:absolute;right:120px;top:168px;height:70px;padding:0 40px;font-size:28px;z-index:4}
.ctbtn svg{width:34px;height:34px}
.ctbtn.sites{top:174px;right:430px;height:62px;padding:0 30px;font-size:23px}
.ctbtn.sites svg{width:28px;height:28px}
/* spotlight: Property deck maps */
.sp-tabs.n4{grid-template-columns:repeat(2,1fr);gap:12px}
.sp-tabs.n4 .tab{height:66px}
.sp-tabs.n1{grid-template-columns:1fr}
#spot .sp-side{bottom:180px}
#spot .sp-body{min-height:0;max-height:440px;overflow:hidden}
.sp-img.zoomable{cursor:zoom-in}
.sp-img .zhint{position:absolute;right:16px;bottom:14px;display:flex;align-items:center;gap:8px;padding:8px 16px;border-radius:30px;background:rgba(4,26,58,.75);font-size:17px;font-weight:700}
.sp-img .zhint svg{width:20px;height:20px}
.sp-note{font-size:24px;line-height:1.4;opacity:.88;margin-top:16px}
.sp-bnd i.star{border:0;background:none;color:#F6B700;font-size:34px;font-style:normal;height:auto;text-align:center}
.conn{margin-top:14px;display:flex;flex-direction:column;gap:10px}
.conn .cr{display:flex;gap:14px;align-items:center;padding:5px 16px;border-radius:16px;background:var(--glass);border:1px solid var(--line)}
.conn .ct{flex:1;min-width:0}
.conn .ct b{display:block;font-size:22px;font-weight:800}
.conn .ct small{display:block;font-size:16px;opacity:.75;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conn .cm{text-align:right;flex:0 0 auto}
.conn .cm b{font-size:28px;font-weight:800;color:var(--yellow)}
.conn .cm b i{font-style:normal;font-size:16px;margin-left:2px}
.conn .cm small{display:block;font-size:15px;opacity:.75}
.amen{list-style:none;margin-top:12px;columns:2;column-gap:20px;font-size:15.5px;line-height:1.25}
.amen li{break-inside:avoid;padding:3px 0 3px 16px;position:relative;opacity:.92}
.amen li::before{content:"";position:absolute;left:0;top:10px;width:7px;height:7px;border-radius:50%;background:var(--yellow)}
#zoom{position:absolute;inset:0;z-index:40;background:rgba(2,14,34,.94);display:none;place-items:center;cursor:zoom-out}
#zoom.on{display:grid}
#zoom img{max-width:1840px;max-height:1000px;object-fit:contain;border-radius:16px}
#zoom .pclose{position:absolute;right:40px;top:30px}
/* 19 Oct: site maps fill their frame (trims the thin white strips in the deck exports); zoom uses the whole screen */
.sp-img img{object-fit:cover;transform:scale(1.03)}
#zoom img{position:absolute;inset:0;width:100%;height:100%;max-width:none;max-height:none;object-fit:contain;border-radius:0}
#zoom.fill img{object-fit:cover;transform:scale(1.025)}
#zoom .pclose{z-index:2;background:rgba(4,26,58,.8)}

(function(){

  phone:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/>',
  car:'<path d="M5 16V11l2-5h10l2 5v5M5 16h14M5 16v3M19 16v3M7.5 13.5h.01M16.5 13.5h.01"/>',

};
const ic=n=>`<svg class="ic" viewBox="0 0 24 24">${ICONS[n]||''}</svg>`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- language ---------- */
let lang=SETTINGS.defaultLang==='en'?'en':'ms';
const tx=o=>o==null?'':(typeof o==='string'?o:(o[lang]??o.en??''));
const t=k=>tx(UI[k]);
function applyStatic(){
  $$('[data-i18n]').forEach(el=>el.innerHTML=t(el.dataset.i18n));
  $$('[data-lang] b').forEach(b=>b.classList.toggle('on',b.dataset.l===lang));
  document.documentElement.lang=lang==='ms'?'ms':'en';
}
function setLang(l){ if(l===lang) return; lang=l; renderAll(); }
document.addEventListener('click',e=>{const b=e.target.closest('[data-lang]'); if(!b) return; e.stopPropagation(); e.preventDefault();
  const hit=e.target.closest('b[data-l]'); setLang(hit?hit.dataset.l:(lang==='ms'?'en':'ms'));},true);

/* ---------- stage + hardening ---------- */
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080);stage.style.transform=`translate(-50%,-50%) scale(${s})`;}
addEventListener('resize',fit);fit();
if(SETTINGS.hideCursor)document.body.classList.add('nocursor');
['contextmenu','gesturestart','dragstart','selectstart'].forEach(e=>document.addEventListener(e,ev=>ev.preventDefault(),{passive:false}));
document.addEventListener('wheel',e=>{if(e.ctrlKey)e.preventDefault();},{passive:false});
document.addEventListener('touchmove',e=>{if(e.touches.length>1)e.preventDefault();},{passive:false});

/* ---------- media ---------- */
const media={video:false,logo:false,videos:{},imgs:{}};
function probe(src,cb){const i=new Image();i.onload=()=>cb(true);i.onerror=()=>cb(false);i.src=src;}
const vid = $('#loopVideo');

probe(SETTINGS.logo,ok=>{media.logo=ok;renderLogo();});
[...DEVS.filter(d=>d.img).map(d=>d.img),...PHILOSOPHY.filter(p=>p.img).map(p=>p.img),...Object.values(SPOTS).flatMap(s=>s.views.map(v=>v.img))].forEach(p=>probe(p,ok=>media.imgs[p]=ok));
VIDEOS.forEach(v=>{const el=document.createElement('video');el.preload='metadata';el.onloadedmetadata=()=>media.videos[v.id]=true;el.onerror=()=>media.videos[v.id]=false;el.src=`media/videos/${v.id}.mp4`;});
function renderLogo(){$$('[data-logo]').forEach(b=>b.innerHTML=media.logo?`<img src="${SETTINGS.logo}" alt="MRT Corp"><span class="tag">${esc(t('head_t'))}</span>`:`<span class="wordmark">MRT <b>CORP</b></span><span class="tag">${esc(t('head_t'))}</span>`);}

/* ---------- top-bar buttons ---------- */
function renderNav(){
  $$('[data-nav]').forEach(n=>{ n.innerHTML=n.dataset.nav.split(',').map(tok=>{
    if(tok==='lang') return `<button class="lang" data-lang aria-label="Bahasa / Language"><b data-l="ms" class="${lang==='ms'?'on':''}">BM</b><b data-l="en" class="${lang==='en'?'on':''}">EN</b></button>`;
    if(tok==='home') return `<button class="iconbtn" data-home>${ic('home')}${n.dataset.nav==='lang,home'?`<span>${t('home')}</span>`:''}</button>`;
    if(tok==='menu') return `<button class="iconbtn" data-go="hub">${ic('back')}<span>${t('menu')}</span></button>`;
    if(tok.startsWith('back:')) return `<button class="iconbtn" data-go="${tok.slice(5)}">${ic('back')}<span>${t('back')}</span></button>`;
    return ''; }).join(''); });
}

/* ---------- navigation ---------- */
let current='attract',busy=false;

function show(id){ $$('.screen').forEach(s=>s.classList.toggle('active',s.id===id)); current=id;
  if(id!=='devd'&&devCarouselTimer){ clearInterval(devCarouselTimer); devCarouselTimer=null; }   // stop the image carousel off-page
  $('#bgLines').style.display=(id==='attract'||id==='sites')?'none':'block';
  if(window.HomeVideo) HomeVideo.onScreen(id); else if(id!=='attract') vid.pause();
  if(id==='sites') buildMap(); else closePanel(); closePlayer(); }
function go(id,wipe){ if(busy||id===current) return; if(!wipe){show(id);return;}
  busy=true; const w=$('#wipe'); w.classList.remove('run'); void w.offsetWidth; w.classList.add('run');
  setTimeout(()=>show(id),470); setTimeout(()=>{w.classList.remove('run');busy=false;},1150); }
function home(){ go('attract',true); }
document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]');
  if (g) {

      if (devCarouselTimer) {

        $('#zoom img').src = activeSrc;
        $('#zoom').classList.remove('fill');
        $('#zoom').classList.add('on');
      }
    };
  }

<!-- =====================================================================
     HOME VIDEO PLAYLIST
     Plays every video in SETTINGS.homeVideos.folder in alphabetical order,
     in a loop, with Previous / Next / Mute / Full-screen buttons.
     Add, remove or re-order videos by changing the files in that folder
     (use 01_, 02_ ... prefixes to set the order). No code change needed.
     How the folder is read (first one that works):
       1. Live folder read — kiosk launched with START-KIOSK.bat
          (Edge flag --allow-file-access-from-files). Picks up changes
          each time the home screen is shown or the playlist loops.
       2. <folder>/playlist.js — written by UPDATE-PLAYLIST.bat
          (START-KIOSK.bat runs it automatically).
       3. SETTINGS.homeVideos.fallback (single file), if set.

<script>
(function(){
  const S = (typeof SETTINGS !== 'undefined') ? SETTINGS : {};
  const CFG = Object.assign({
    folder: 'home-videos/',                       // folder next to index.html
    muted: false,                                 // start muted?
    extensions: ['mp4','webm','m4v','mov','ogv'], // file types picked up
    fallback: ''                                  // optional single video if the folder is empty / unreadable
  }, S.homeVideos || {});
  if (!/\/$/.test(CFG.folder)) CFG.folder += '/';

  const vid = document.getElementById('loopVideo');
  const frame = vid && vid.closest('.video-frame');
  const attract = document.getElementById('attract');
  if (!vid || !frame || !attract) { console.warn('[home-video] video frame not found'); return; }

  let list = [], idx = 0, source = 'none', bad = new Set();
  let muted = !!CFG.muted, autoMuted = false, onHome = attract.classList.contains('active');
  let weMadeFs = false, retryT = null, scanning = null;

  vid.removeAttribute('loop'); vid.loop = false; vid.muted = muted;

  /* ---------- controls ---------- */
  const IC = {
    prev: '<svg viewBox="0 0 24 24"><path class="f" d="M19 5.5v13L9.5 12z"/><path d="M6 5.5v13"/></svg>',
    next: '<svg viewBox="0 0 24 24"><path class="f" d="M5 5.5v13L14.5 12z"/><path d="M18 5.5v13"/></svg>',
    mute: '<svg viewBox="0 0 24 24"><g class="off-muted"><path class="f" d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></g>'
        + '<g class="on-muted"><path class="f" d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></g></svg>',
    fs:   '<svg viewBox="0 0 24 24"><path class="off-max" d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>'
        + '<path class="on-max" d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/></svg>'
  };
  const bar = document.createElement('div');
  bar.className = 'hv-ctrls';
  bar.innerHTML = '<span class="hv-count" id="hvCount"></span>'
    + '<button class="hv-btn" data-hv="prev" aria-label="Previous video">' + IC.prev + '</button>'
    + '<button class="hv-btn" data-hv="next" aria-label="Next video">' + IC.next + '</button>'
    + '<button class="hv-btn" data-hv="mute" aria-label="Mute / unmute">' + IC.mute + '</button>'
    + '<button class="hv-btn" data-hv="fs" aria-label="Full screen">' + IC.fs + '</button>';
  frame.appendChild(bar);
  let awakeT = null;   // controls hidden; tapping the video shows them for 5 s
  let wasAwake = false;   // a tap on hidden buttons only reveals them, it does not press them
  frame.addEventListener('pointerdown', () => { wasAwake = frame.classList.contains('hv-awake'); frame.classList.add('hv-awake'); clearTimeout(awakeT); awakeT = setTimeout(() => frame.classList.remove('hv-awake'), 5000); }, true);
  // taps on the video or its buttons never start the kiosk journey
  ['click','pointerdown','touchstart','touchend'].forEach(ev => frame.addEventListener(ev, e => e.stopPropagation()));
  bar.addEventListener('click', e => {
    const b = e.target.closest('[data-hv]'); if (!b || !wasAwake) return;
    e.preventDefault();
    const a = b.dataset.hv;
    if (a === 'prev') play(idx - 1);
    else if (a === 'next') play(idx + 1);
    else if (a === 'mute') setMuted(!muted, true);
    else if (a === 'fs') setMax(!frame.classList.contains('hv-max'));
  });

  function renderState(){
    frame.classList.toggle('hv-muted', vid.muted);
    const c = document.getElementById('hvCount');
    if (c) { c.textContent = list.length ? (idx + 1) + ' / ' + list.length : ''; c.style.display = list.length > 1 ? '' : 'none'; }
  }
  function setMuted(m, byUser){
    muted = m; if (byUser) autoMuted = false;
    vid.muted = m; if (!m && onHome && vid.paused) vid.play().catch(()=>{});
    renderState();
  }
  function setMax(on){
    frame.classList.toggle('hv-max', on);
    const covers = window.innerHeight >= screen.height - 4 && window.innerWidth >= screen.width - 4;   // already full screen (Edge kiosk mode)
    if (on && !document.fullscreenElement && !covers && document.documentElement.requestFullscreen) {
      document.documentElement.requestFullscreen().then(() => { weMadeFs = true; }).catch(()=>{});
    } else if (!on && weMadeFs && document.fullscreenElement) {
      weMadeFs = false; document.exitFullscreen().catch(()=>{});
    }
  }
  document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && weMadeFs) { weMadeFs = false; frame.classList.remove('hv-max'); } });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && frame.classList.contains('hv-max')) setMax(false); });

  function unlock(e){
    if (e.target.closest && e.target.closest('.hv-ctrls')) return;
    if (autoMuted) { autoMuted = false; setMuted(false); }
  }
  document.addEventListener('pointerdown', unlock, true);

  /* ---------- reading the folder ---------- */
  const isVideo = n => new RegExp('\\.(' + CFG.extensions.join('|') + ')$', 'i').test(n);
  const natural = (a, b) => a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' });

  function readFolder(){            // null = folder could not be read; [] = folder is empty
    return new Promise(res => {
      let done = false; const fin = v => { if (!done) { done = true; res(v); } };
      try {
        const x = new XMLHttpRequest();
        x.open('GET', CFG.folder + (location.protocol === 'file:' ? '' : '?t=' + Date.now()));
        x.timeout = 4000;
        x.onload = () => {
          const t = x.responseText || '';
          if (!t || (x.status && x.status >= 400)) return fin(null);
          const names = []; let m;
          const rowRe = /addRow\("((?:[^"\\]|\\.)*)","(?:[^"\\]|\\.)*",(\d)/g;        // Edge / Chrome folder page
          while ((m = rowRe.exec(t))) if (m[2] === '0') { try { names.push(JSON.parse('"' + m[1] + '"')); } catch (e) { names.push(m[1]); } }
          if (!/addRow\(/.test(t)) {                                                   // web-server folder page
            const hrefRe = /href\s*=\s*["']([^"'?#]+)["']/gi;
            while ((m = hrefRe.exec(t))) { try { const n = decodeURIComponent(m[1]).split('/').filter(Boolean).pop(); if (n) names.push(n); } catch (e) {} }
          }
          fin([...new Set(names)]);
        };
        x.onerror = x.ontimeout = () => fin(null);
        x.send();
      } catch (e) { fin(null); }
      setTimeout(() => fin(null), 5000);
    });
  }
  function readPlaylistJs(){
    return new Promise(res => {
      try { delete window.HOME_PLAYLIST; } catch (e) { window.HOME_PLAYLIST = undefined; }
      const s = document.createElement('script');
      s.src = CFG.folder + 'playlist.js?t=' + Date.now();
      const fin = v => { s.remove(); res(v); };
      s.onload = () => fin(Array.isArray(window.HOME_PLAYLIST) ? window.HOME_PLAYLIST.map(String) : null);
      s.onerror = () => fin(null);
      document.head.appendChild(s);
    });
  }
  async function scan(){
    let names = await readFolder(), src = 'live folder';
    if (!names || !names.some(isVideo)) {                 // folder unreadable, or a web-server page with no recognisable video links (e.g. Android local server)
      const pl = await readPlaylistJs();
      if (pl && pl.some(isVideo)) { names = pl; src = 'playlist.js'; }
    }
    let urls = (names || []).filter(isVideo).sort(natural).map(n => CFG.folder + encodeURIComponent(n));
    if (!urls.length && CFG.fallback) { urls = [CFG.fallback]; src = 'fallback'; }
    if (!urls.length) src = names === null ? 'folder not readable' : 'folder empty';
    return { urls, src };
  }
  function refresh(startAt){        // re-read the folder, keep playing the current video if it is still there
    if (scanning) return scanning;
    scanning = scan().then(r => {
      scanning = null;
      const cur = list[idx], changed = r.urls.join('|') !== list.join('|');
      list = r.urls; source = r.src;
      if (changed) { bad.clear(); console.log('[home-video] ' + list.length + ' video(s) from ' + source, list.map(decodeURIComponent)); }
      if (Array.isArray(S.loopPlaylist)) S.loopPlaylist = list.slice();   // Commercial QA panel
      const k = list.indexOf(cur);
      if (!list.length) { noVideo(true); retryLater(); return; }
      if (startAt !== undefined) play(startAt);
      else if (k >= 0) { idx = k; vid.loop = list.length === 1; if (onHome && vid.paused) resume(); renderState(); }
      else play(0);
    });
    return scanning;
  }
  function retryLater(){ clearTimeout(retryT); retryT = setTimeout(() => { if (onHome) refresh(); else retryLater(); }, 30000); }

  /* ---------- playback ---------- */
  function noVideo(on){
    attract.classList.toggle('novideo', on);
    frame.classList.toggle('hv-none', on);
    vid.style.visibility = on ? 'hidden' : 'visible';
    if (on) { frame.classList.remove('hv-max'); vid.removeAttribute('src'); vid.load(); }
  }
  function resume(){
    if (!onHome) return;
    vid.muted = muted;
    const p = vid.play();
    if (p && p.catch) p.catch(() => {                    // autoplay with sound blocked -> play muted
      if (!vid.muted) { vid.muted = true; autoMuted = !muted; renderState(); vid.play().catch(()=>{}); }
    });
    renderState();
  }
  function play(i){
    if (!list.length) return;
    idx = ((i % list.length) + list.length) % list.length;
    const src = list[idx];
    vid.loop = list.length === 1;
    if (vid.getAttribute('src') !== src) vid.src = src; else vid.currentTime = 0;
    resume();
  }
  vid.addEventListener('loadeddata', () => { bad.delete(list[idx]); noVideo(false); renderState(); });
  vid.addEventListener('ended', () => {
    if (list.length <= 1) return;
    if (idx + 1 >= list.length) refresh(0);              // end of the playlist: re-read the folder, start again from the first
    else play(idx + 1);
  });
  vid.addEventListener('error', () => {
    const src = vid.getAttribute('src'); if (!src) return;
    console.warn('[home-video] cannot play', decodeURIComponent(src));
    bad.add(src);
    if (bad.size >= list.length) { noVideo(true); retryLater(); return; }
    setTimeout(() => play(idx + 1), 300);
  });

  /* ---------- called by show() when the screen changes ---------- */
  function onScreen(id){
    onHome = (id === 'attract');
    if (onHome) refresh();
    else { vid.pause(); if (frame.classList.contains('hv-max')) setMax(false); }
  }

  window.HomeVideo = { onScreen, refresh, next: () => play(idx + 1), prev: () => play(idx - 1),
    status: () => ({ folder: CFG.folder, source, count: list.length, playing: list[idx] ? decodeURIComponent(list[idx]) : '', files: list.map(decodeURIComponent), unplayable: [...bad].map(decodeURIComponent) }) };
  renderState();
  refresh();
})();
</script>
