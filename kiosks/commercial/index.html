<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MRT Corp · Commercial Kiosk · TXA 2026</title>
<style>
/* =========================================================
   MRT CORP COMMERCIAL KIOSK · TXA 2026 · WIREFRAME v0.1
   Same design system as the P&E kiosk (Mid Blue, Palette 496):
   1920x1080 scaled stage, 76px top-bar pills, 100px action buttons,
   BM | EN switch, idle reset, wipe transition, QA panel (5 taps top-left).
   Offline: no server, no database, no internet.
   ========================================================= */
:root{
  --navy:#07254F; --navy2:#0D4386; --deep:#041A3A;
  --mid:#07254F; --mid2:#0A2E5E; --mid3:#0D4386;   /* midnight blue */
  --blue:#2771CC; --red:#E42132; --teal:#269C95; --yellow:#F6B700; --orange:#EE7623; --kgl:#00953B; --pyl:#F6B700;
  --white:#fff;
  --glass:rgba(255,255,255,.07); --glass2:rgba(255,255,255,.12); --line:rgba(255,255,255,.14);
  --font:"Segoe UI Variable Display","Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:var(--font);color:#fff;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;overscroll-behavior:none}
body.nocursor, body.nocursor *{cursor:none!important}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer;touch-action:manipulation;text-align:inherit}
img{-webkit-user-drag:none;user-drag:none}
svg.ic{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- fixed 1920x1080 stage (Mid Blue across all screens) ---------- */
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center;overflow:hidden;
  background:radial-gradient(1200px 800px at 80% -10%,#0D4386 0%,transparent 60%),radial-gradient(900px 700px at -10% 110%,#0b3470 0%,transparent 55%),var(--mid)}
.screen{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease,visibility 0s .45s}
.screen.active{opacity:1;visibility:visible;transition:opacity .45s ease}
.grid{position:absolute;inset:0;pointer-events:none;opacity:.35;
  background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:60px 60px}
#bgLines{position:absolute;inset:0;opacity:.28;pointer-events:none}
#bgLines path{fill:none;stroke-width:6;stroke-linecap:round;stroke-dasharray:14 26;animation:flow 6s linear infinite}
#bgLines path:nth-child(2){animation-duration:8s}#bgLines path:nth-child(3){animation-duration:7s}#bgLines path:nth-child(4){animation-duration:9s}
@keyframes flow{to{stroke-dashoffset:-400}}
@keyframes rise{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
@keyframes fadeup{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}

/* ---------- top bar ---------- */
.topbar{position:absolute;left:0;right:0;top:0;height:110px;display:flex;align-items:center;justify-content:space-between;padding:0 64px;z-index:5}
.brand{display:flex;align-items:center;gap:22px}
.brand img{height:66px;width:auto;display:block}
.brand .tag{font-size:20px;letter-spacing:.18em;opacity:.75;border-left:2px solid var(--line);padding-left:22px;text-transform:uppercase;position:relative;top:14px;line-height:1}

.navbtns{display:flex;gap:18px}
.iconbtn{height:76px;min-width:76px;padding:0 26px;border-radius:40px;background:var(--glass2);border:1.5px solid var(--line);display:flex;align-items:center;gap:12px;font-size:24px;font-weight:600;transition:transform .15s,background .2s;white-space:nowrap}
.iconbtn:active{transform:scale(.94);background:rgba(255,255,255,.22)}
.iconbtn svg{width:32px;height:32px}
.lang{height:76px;padding:6px;border-radius:40px;background:var(--glass2);border:1.5px solid var(--line);display:flex;gap:4px;align-items:stretch;transition:transform .15s}
.lang b{min-width:84px;padding:0 18px;border-radius:34px;display:grid;place-items:center;font-size:24px;font-weight:800;letter-spacing:.06em;opacity:.65;transition:background .2s,color .2s}
.lang b.on{background:var(--yellow);color:var(--navy);opacity:1}
.lang:active{transform:scale(.96)}
.footer{position:absolute;left:0;right:0;bottom:0;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 64px;font-size:19px;opacity:.7;letter-spacing:.04em;z-index:4}
.linebar{position:absolute;left:0;right:0;bottom:64px;height:6px;display:flex;z-index:4}
.linebar i{flex:1}
.eyebrow{font-size:24px;letter-spacing:.3em;text-transform:uppercase;color:var(--yellow);font-weight:700}

/* ---------- buttons (P&E standard sizes) ---------- */
.btn{height:80px;border-radius:50px;font-size:28px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:16px;transition:transform .15s;letter-spacing:.03em;padding:0 44px;white-space:nowrap}
.btn:active{transform:scale(.96)}
.btn svg{width:36px;height:36px;stroke-width:2.4}
.btn.primary{background:var(--red);box-shadow:0 18px 44px rgba(228,33,50,.4)}
.btn.ghost{background:transparent;border:2.5px solid rgba(255,255,255,.55)}
.btn.soft{background:var(--glass2);border:1.5px solid var(--line)}

/* ---------- media placeholders (wireframe) ---------- */
.media{position:relative;overflow:hidden;background:linear-gradient(135deg,color-mix(in srgb,var(--c,#2771CC) 55%,var(--mid)),color-mix(in srgb,var(--c,#2771CC) 15%,var(--deep)))}
.media > img,.media > video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.media .ph{position:absolute;inset:14px;border:3px dashed rgba(255,255,255,.35);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:16px}
.media .ph svg{width:64px;height:64px;opacity:.75}
.media .ph b{font-size:20px;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.media .ph code{font-family:Consolas,"Courier New",monospace;font-size:17px;opacity:.75;word-break:break-all}
.tbc{display:inline-block;background:var(--yellow);color:var(--navy);font-weight:800;font-size:16px;padding:4px 12px;border-radius:8px;letter-spacing:.08em;vertical-align:middle;margin-left:10px;text-transform:uppercase}

/* =========================================================
   0. ATTRACT (Mid Blue home, P&E layout)
   ========================================================= */
#attract{background:var(--mid)}
#attractBg{position:absolute;inset:0;background:radial-gradient(1400px 900px at 70% 30%,#0D4386,var(--deep))}
#attractBg svg path{fill:none;stroke-width:14;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:3000;stroke-dashoffset:3000;opacity:.55;animation:draw 5s ease forwards}
.fbHead{position:absolute;left:120px;top:205px;width:800px;z-index:2}
.fbHead .k{font-size:24px;letter-spacing:.3em;text-transform:uppercase;color:var(--yellow);font-weight:700;margin-bottom:26px}
.fbHead h1{font-size:76px;line-height:1.02;font-weight:800;letter-spacing:-.02em}
.fbHead h1 span{color:var(--red)}
.fbHead p{font-size:28px;line-height:1.3;margin-top:24px;color:rgba(255,255,255,.88);text-wrap:balance}
.video-frame {
  position: absolute;
  top: 180px;
  right: 80px;
  width: 880px;
  height: 495px;              /* 16:9, so the whole standby video fits (videos are 1920x1080 / 1280x720) */
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 20px 50px rgba(0, 0, 0, .35);
  z-index: 2;
  background: #fff;
  transition: all .3s cubic-bezier(.4, 0, .2, 1);
}
.video-frame.media { background: #fff; }
.video-frame .ph { border-color: #b9cbe4; color: var(--navy); }

/* Video sizing: show the whole video, never crop */
.video-frame video, #loopFrame > video {
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: #000;
  display: block;
}

.shade{position:absolute;inset:0;pointer-events:none;z-index:1;
  background:linear-gradient(0deg,rgba(4,26,58,.8) 0%,rgba(4,26,58,0) 38%),linear-gradient(180deg,rgba(4,26,58,.5) 0%,rgba(4,26,58,0) 18%)}
.attnet{position:absolute;left:80px;bottom:80px;z-index:3;height:100px;padding:0 44px 0 34px;border-radius:50px;background:var(--blue);color:#fff;display:flex;align-items:center;gap:18px;font-size:36px;font-weight:800;box-shadow:0 18px 44px rgba(39,113,204,.45);transition:transform .15s}
.attstats{position:absolute;left:120px;top:720px;max-width:800px;z-index:3;display:flex;align-items:center;gap:0}   /* must end before the video frame (x=960) */
.ast{display:flex;align-items:center;gap:12px;padding:0 24px;border-left:2px solid rgba(255,255,255,.18);animation:astIn .8s ease both}
.ast:first-child{padding-left:0;border-left:0}
.ast:nth-child(2){animation-delay:.15s}.ast:nth-child(3){animation-delay:.3s}
@keyframes astIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.ast .ai svg{width:58px;height:58px;color:var(--red);opacity:1}
.ast b{display:flex;align-items:baseline;gap:5px;font-size:50px;font-weight:800;line-height:1;color:#fff;letter-spacing:-.01em}
.ast b i{font-style:normal;font-size:22px;font-weight:800}
.ast small{display:block;font-size:15px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:rgba(255,255,255,.85);margin-top:6px;white-space:nowrap}
.attnet:active{transform:scale(.95)}
.attnet svg{width:44px;height:44px;stroke-width:2.2}
@keyframes pop{0%{transform:translateY(30px);opacity:0}100%{transform:none;opacity:1}}
.fab {
  position: absolute; right: 90px; bottom: 80px; display: flex; align-items: center; gap: 26px; height: 100px; padding: 0 44px 0 44px; border-radius: 80px;
 
  background: linear-gradient(135deg, #e42132ba); box-shadow: 0 20px 60px rgba(228, 33, 50, .55); font-size: 36px; font-weight: 800; letter-spacing: .02em; animation: bob 3s ease-in-out infinite; z-index: 3;
}
.fab svg {
  width: 72px;
  height: 72px;
  stroke-width: 1.6;
  fill: none;
  stroke: currentColor;
  overflow: visible;
  transform-origin: 70% 80%;
  /* Slowed down to 3.5s for a smooth, relaxed rhythm */
  animation: clickTap 2.5s ease-in-out infinite; 
}

/* Slow & deliberate click motion */
@keyframes clickTap {
  0%, 35%, 100% {
    transform: scale(1) rotate(0deg) translate(0, 0);
  }
  48% {
    /* Gentle press down */
    transform: scale(0.85) rotate(-10deg) translate(-2px, 4px);
  }
  60% {
    /* Smooth bounce release */
    transform: scale(1.03) rotate(2deg) translate(0, -1px);
  }
  70% {
    transform: scale(1) rotate(0deg) translate(0, 0);
  }
}

/* Touch dot pulse on contact */

/* Wave ripple expanding outwards like water */

@keyframes ring{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.35,1.6);opacity:0}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.fab small{display:block;font-size:22px;font-weight:500;opacity:.9;letter-spacing:.06em;margin-top:2px}

.mute{position:absolute;left:960px;top:740px;z-index:3;height:64px;padding:0 22px;border-radius:32px;background:rgba(4,26,58,.55);border:1.5px solid var(--line);display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700;letter-spacing:.08em}
.mute svg{width:28px;height:28px}

/* =========================================================
   1. HUB · 5 business tiles + quick links
   ========================================================= */
.hero-title{position:absolute;left:0;right:0;top:138px;text-align:center}
.hero-title h2{font-size:68px;font-weight:800;letter-spacing:-.01em;margin-top:14px}
.hero-title p{font-size:28px;opacity:.8;margin-top:8px}
.tiles5{position:absolute;left:80px;right:80px;top:360px;display:grid;grid-template-columns:repeat(5,1fr);gap:24px}
.btile{height:450px;border-radius:32px;overflow:hidden;display:flex;flex-direction:column;text-align:left;position:relative;
  background:linear-gradient(160deg,rgba(255,255,255,.14),rgba(255,255,255,.04));border:1.5px solid var(--line);box-shadow:0 26px 70px rgba(0,0,0,.3);
  animation:rise .6s cubic-bezier(.2,.8,.2,1) both;transition:transform .18s}
.btile:nth-child(2){animation-delay:.07s}.btile:nth-child(3){animation-delay:.14s}.btile:nth-child(4){animation-delay:.21s}.btile:nth-child(5){animation-delay:.28s}
.btile:active{transform:scale(.97)}
.btile .media{height:200px;flex:0 0 200px}
.btile .media .ph{inset:10px}
.btile .media .ph svg{width:54px;height:54px}
.btile .media .ph code{font-size:14px}
.btile .bar{height:8px;background:var(--c);flex:0 0 8px}
.btile .tb{padding:20px 24px 22px;display:flex;flex-direction:column;flex:1}
.btile h3{font-size:28px;font-weight:800;line-height:1.1}
.btile p{font-size:20px;opacity:.82;margin-top:8px;line-height:1.3}
.btile .go{margin-top:auto;align-self:flex-start;height:64px;padding:0 28px;border-radius:40px;background:var(--c);color:var(--on,#fff);display:flex;align-items:center;gap:10px;font-size:24px;font-weight:800}
.btile .go svg{width:28px;height:28px;stroke-width:2.6}
.quick{position:absolute;left:80px;right:80px;top:850px;display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.qbtn{height:100px;border-radius:50px;background:var(--glass2);border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;gap:16px;font-size:28px;font-weight:800;transition:transform .15s;white-space:nowrap}
.qbtn:active{transform:scale(.96)}
.qbtn .qi{width:60px;height:60px;border-radius:50%;background:var(--c);color:var(--on,#fff);display:grid;place-items:center;flex:0 0 60px}
.qbtn .qi svg{width:32px;height:32px;stroke-width:2.2}

/* =========================================================
   2. SEGMENT (one template for 5 businesses)
   ========================================================= */
.srail{position:absolute;left:200px;right:200px;top:118px;height:120px;z-index:4}
.srail .track{position:absolute;left:60px;right:60px;top:30px;height:8px;border-radius:4px;background:rgba(255,255,255,.16)}
.srail .stns{position:absolute;inset:0;display:grid;grid-template-columns:repeat(5,1fr)}
.srail .stn{display:flex;flex-direction:column;align-items:center}
.srail .dot{width:68px;height:68px;border-radius:50%;border:6px solid var(--sc);background:var(--mid);display:grid;place-items:center;transition:all .3s}
.srail .dot svg{width:30px;height:30px;stroke-width:2;color:var(--sc)}
.srail .stn.cur .dot{background:var(--sc);box-shadow:0 0 0 10px color-mix(in srgb,var(--sc) 30%,transparent);transform:scale(1.08)}
.srail .stn.cur .dot svg{color:var(--on,#fff)}
.srail .lbl{font-size:19px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-top:10px;opacity:.6;white-space:nowrap}
.srail .stn.cur .lbl{opacity:1}
.seg-left{position:absolute;left:120px;top:272px;width:820px}
.seg-left .eyebrow{color:var(--sc)}
.seg-left h2{font-size:72px;font-weight:800;line-height:1;margin-top:10px;letter-spacing:-.01em}
.seg-left .desc{font-size:25px;line-height:1.42;opacity:.88;margin-top:18px}
.seg-left h5{font-size:20px;letter-spacing:.22em;text-transform:uppercase;color:var(--yellow);font-weight:800;margin-top:26px}
.prods{display:flex;gap:24px;margin-top:16px}
.pcard{flex:1;height:200px;border-radius:24px;overflow:hidden;position:relative;border:2px solid var(--line);box-shadow:0 18px 44px rgba(0,0,0,.3);transition:transform .15s;text-align:left}
.pcard:active{transform:scale(.97)}
.pcard:disabled{cursor:default}
.pcard:disabled:active{transform:none}
.pcard .media{position:absolute;inset:0}
.pcard .media .ph{inset:10px;justify-content:flex-start;padding-top:14px;gap:6px}
.pcard .media .ph b{display:none}
.pcard .media .ph code{font-size:14px}
.pcard .media .ph svg{width:36px;height:36px}
.pcard .cap{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:18px 22px;background:linear-gradient(0deg,rgba(4,26,58,.95),rgba(4,26,58,0));display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.pcard .cap b{font-size:27px;font-weight:800;line-height:1.1}
.pcard .cap i{flex:0 0 50px;height:50px;border-radius:50%;background:var(--sc);color:var(--on,#fff);display:grid;place-items:center}
.pcard .cap i svg{width:26px;height:26px;stroke-width:2.6}
.seg-video{position:absolute;right:80px;top:272px;width:840px;height:472px;border-radius:24px;box-shadow:0 24px 60px rgba(0,0,0,.4);border:2px solid var(--line)}

.seg-actions{position:absolute;left:120px;right:80px;top:872px;display:flex;gap:20px;align-items:center}
.seg-actions .next{margin-left:auto}
.btile .bico{position:absolute;right:22px;top:162px;width:72px;height:72px;border-radius:50%;background:var(--c);color:var(--on,#fff);display:grid;place-items:center;z-index:3;box-shadow:0 8px 20px rgba(0,0,0,.35);border:3px solid rgba(255,255,255,.9)}
.btile .bico svg{width:44px;height:44px}
.sstat .si svg.icimg{width:36px;height:36px}
.srail .dot svg.icimg{width:40px;height:40px}
.segstats{flex:1;display:flex;justify-content:center;gap:14px;min-width:0}
.sstat{display:flex;align-items:center;gap:10px;height:80px;padding:0 16px 0 10px;border-radius:40px;background:rgba(255,255,255,.06);border:2px solid var(--line)}
.sstat .si{flex:0 0 50px;height:50px;border-radius:50%;background:var(--sc);color:var(--on,#fff);display:grid;place-items:center}
.sstat .si svg{width:26px;height:26px;stroke-width:2.4}
.sstat b{display:block;font-size:28px;font-weight:800;line-height:1}
.sstat small{display:block;font-size:13px;letter-spacing:.08em;text-transform:uppercase;opacity:.75;margin-top:4px;line-height:1.15;max-width:150px}
.seg-actions .btn{padding:0 34px}
.seg-actions .next .nn{color:var(--nc)}

/* product panel (slide-in) */
#scrim{position:absolute;inset:0;background:rgba(2,14,34,.6);opacity:0;visibility:hidden;transition:opacity .35s,visibility 0s .35s;z-index:20}
#scrim.on{opacity:1;visibility:visible;transition:opacity .35s}
#panel{position:absolute;right:0;top:0;bottom:0;width:1160px;background:linear-gradient(180deg,#0a2e5e,#061d42);z-index:21;transform:translateX(105%);transition:transform .55s cubic-bezier(.2,.8,.2,1);box-shadow:-40px 0 100px rgba(0,0,0,.5);overflow:hidden}
#panel.on{transform:none}
.phero{position:relative;height:400px}
.phero .media{position:absolute;inset:0}
.phero .media .ph{justify-content:flex-start;padding-top:40px}
.phero .media > img{animation:kb 18s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.12) translate(-2%,-2%)}}
.phero .veil{position:absolute;inset:0;z-index:2;background:linear-gradient(0deg,rgba(4,26,58,.97) 0%,rgba(4,26,58,.25) 55%,rgba(4,26,58,0) 100%)}
.phero .ttl{position:absolute;left:70px;right:70px;bottom:36px;z-index:3}
.chip{display:inline-flex;align-items:center;gap:10px;padding:8px 20px;border-radius:30px;background:rgba(255,255,255,.18);font-size:20px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.chip i{width:26px;height:10px;border-radius:5px;background:var(--sc);outline:2px solid #fff}
.phero h2{font-size:64px;font-weight:800;margin-top:14px;line-height:1.02}
.pclose{position:absolute;right:36px;top:36px;z-index:4;width:76px;height:76px;border-radius:50%;background:rgba(4,26,58,.6);border:2px solid rgba(255,255,255,.4);display:grid;place-items:center}
.pclose svg{width:34px;height:34px;stroke-width:2.4}
#panel .lang{position:absolute;right:128px;top:36px;z-index:4;background:rgba(4,26,58,.6);border:2px solid rgba(255,255,255,.4)}
.pbody{padding:30px 70px 0}
.pbody .pdesc{font-size:28px;line-height:1.42;opacity:.92}
.pbody h5{font-size:20px;letter-spacing:.22em;text-transform:uppercase;color:var(--yellow);font-weight:800;margin:30px 0 16px}
.kfacts{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.kfacts div{border-radius:20px;padding:18px 22px;background:var(--glass);border:1.5px solid var(--line);border-top:6px solid var(--sc)}
.kfacts small{display:block;font-size:17px;letter-spacing:.14em;text-transform:uppercase;opacity:.65;font-weight:700}
.kfacts b{display:block;font-size:25px;font-weight:700;margin-top:6px;line-height:1.25}
.pactions{position:absolute;left:70px;right:70px;bottom:44px;display:flex;gap:24px}
.pactions .btn{flex:1;padding:0 28px}
.psrc{position:absolute;left:70px;right:70px;bottom:160px;font-size:18px;opacity:.6;font-style:italic}

/* QR sheet (bottom sheet) */
#qrsheet{position:absolute;left:50%;top:50%;width:1100px;transform:translate(-50%,-46%) scale(.96);opacity:0;visibility:hidden;z-index:31;border-radius:40px;padding:56px 60px;
  background:linear-gradient(160deg,var(--mid2),var(--mid));border:2px solid var(--line);box-shadow:0 40px 120px rgba(0,0,0,.55);display:flex;gap:56px;align-items:center;transition:all .35s cubic-bezier(.2,.8,.2,1)}

svg.fxmap .keys{opacity:0;transition:opacity .6s}

.fx-story{position:absolute;left:80px;top:128px;width:540px;z-index:3}
.fx-story .eyebrow{font-size:17px;letter-spacing:.22em;color:#4FE3FF;white-space:nowrap}

.fx-step h3{font-size:21px;font-weight:800}

.fx-kpis{position:absolute;left:80px;top:866px;width:540px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;z-index:3}

.fx-kpis small{font-size:14px;opacity:.8}

.fx-kpis b.wic{display:flex;align-items:center;gap:10px}

.fx-side{position:absolute;left:1440px;right:60px;top:128px;z-index:3}
.fx-side .eyebrow{font-size:16px;color:#4FE3FF}
.fx-side .eyebrow.y{color:var(--yellow);margin-top:20px}

.fx-chip{display:flex;align-items:center;gap:12px;padding:7px 14px;border-radius:14px;background:rgba(255,255,255,.06);border:1.5px solid var(--line);text-align:left;transition:all .25s;width:100%}
.fx-chip i{flex:0 0 36px;height:36px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 22%,transparent);border:1.5px solid var(--c)}
.fx-chip i svg{width:20px;height:20px;stroke:var(--c);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fx-chip b{display:block;font-size:17px;font-weight:800}
.fx-chip small{display:block;font-size:13px;opacity:.75;margin-top:1px}
.fx-chip.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.fx-why{margin-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fx-why div{border-radius:14px;padding:10px 12px;background:rgba(246,183,0,.07);border:1px solid rgba(246,183,0,.35)}
.fx-why i{display:block;width:26px;height:26px}

.fx-why b{display:block;font-size:16px;font-weight:800;margin-top:4px}
.fx-why small{display:block;font-size:12.5px;line-height:1.3;opacity:.82;margin-top:2px}

.fx-how div{text-align:center;font-size:12.5px;line-height:1.25;font-weight:600}

let icN=0;
const ic = (n,extra='') => IMG_ICONS[n]
  ? (id=>`<svg class="ic icimg" viewBox="0 0 24 24" ${extra}><defs><mask id="${id}"><image href="${IMG_ICONS[n]}" width="24" height="24"/></mask></defs><rect width="24" height="24" fill="currentColor" stroke="none" mask="url(#${id})"/></svg>`)('icm'+(++icN))
  : `<svg class="ic" viewBox="0 0 24 24" ${extra}>${ICONS[n]||''}</svg>`;

/* ---------- language ---------- */
let lang = LANG.defaultLang==='ms' ? 'ms' : 'en';
const L = o => o==null ? '' : (typeof o==='string' ? o : (o[lang]!=null ? o[lang] : o.en));
const T = k => L(UI[k]);
function applyStatic(){
  $$('[data-t]').forEach(el=>{ el.innerHTML = T(el.dataset.t); });
  $$('[data-lang] b').forEach(b=>b.classList.toggle('on', b.dataset.l===lang));
  $$('[data-iconbtn]').forEach(b=>{ const t=b.dataset.iconbtn;
    b.innerHTML = t==='back' ? ic('back')+`<span>${T('back')}</span>` : t==='home' ? ic('home')+`<span>${T('home')}</span>` : ic('home'); });
  document.documentElement.lang = lang;
  renderAttStats();
}
/* Landing page headline figures, same icons and numbers as the Zone 3 Commercial wall */
const ATT_STATS = [
  {i:"st_people",  n:"148",  u:{en:"Million", ms:"Juta"}, l:{en:"Passengers annually", ms:"Penumpang setahun"}},
  {i:"st_station", n:"63",   u:"",                         l:{en:"Stations", ms:"Stesen"}},
  {i:"st_network", n:">100", u:"km",                       l:{en:"Network", ms:"Rangkaian"}} ];
function renderAttStats(){ const el=$('#attStats'); if(!el) return;
  el.innerHTML = ATT_STATS.map(t=>`<div class="ast"><span class="ai">${ic(t.i)}</span><div><b>${t.n}${t.u?`<i>${L(t.u)}</i>`:''}</b><small>${L(t.l)}</small></div></div>`).join(''); }

/* ---------- stage scaling + kiosk hardening (P&E) ---------- */
function fit(){ const s=Math.min(innerWidth/1920, innerHeight/1080); stage.style.transform=`translate(-50%,-50%) scale(${s})`; }

/* ---------- media helpers: placeholder underneath, real file on top when present ---------- */
const media = {};   // path -> true/false (for QA panel)
window.__mOk = (el,p)=>{ media[p]=true; };
window.__mBad = (el,p)=>{ media[p]=false; el.remove(); };
const short = p => p.replace(/^assets\//,'');
function mImg(src, icon, label){
  return `<div class="ph">${ic(icon||'image')}<b>${label||'Photo'}</b><code>${short(src)}</code></div>`+
         `<img src="${src}" alt="" onload="__mOk(this,'${src}')" onerror="__mBad(this,'${src}')">`;
}
function mVid(src, label){
  return `<div class="ph">${ic('play')}<b>${label||'Video'}</b><code>${short(src)}</code></div>`+
         `<video src="${src}" muted loop playsinline autoplay preload="auto" onloadeddata="__mOk(this,'${src}')" onerror="__mBad(this,'${src}')"></video>`;
}
function qrHTML(src){
  return `<div class="qrph">QR CODE<br>${short(src)}<br>(Commercial to supply)</div>`;
}
function fillQR(box, src, fallback){
  box.innerHTML = qrHTML(src);
  const i=new Image();
  i.onload=()=>{ media[src]=true; box.innerHTML=`<img src="${src}" alt="QR code">`; };
  i.onerror=()=>{ media[src]=false; if(fallback && fallback!==src){ const f=new Image(); f.onload=()=>{ box.innerHTML=`<img src="${fallback}" alt="QR code">`; }; f.src=fallback; } };
  i.src=src;
}

/* ================= NETWORK MAP ================= */
const on = c => c==='#F6B700' ? '#07254F' : '#fff';
const NS='http://www.w3.org/2000/svg';
const STN = {};            // id -> {id,name,pr,cob,conn,lines:[],x,y}
function addStn(row, line){
  const [id,name,pr,cob,conn]=row;
  const s = STN[id] || (STN[id]={id,name,pr:!!pr,cob,conn:[],lines:[]});
  s.lines.push(line); if(conn) s.conn.push(conn); if(cob && !s.cob) s.cob=cob;
  return s;
}
/* Map layout, after the official KGL / PYL line maps: both lines drawn as "U" shapes with horizontal labels.
   PYL is the outer U (top row, right side, bottom row); KGL the inner U. Kwasa Damansara joins them on the left,
   TRX is a single interchange ring between the two right-hand sides. side = where the label sits (up/down/left/right). */
const MAP = { pylTop:290, kglTop:430, kglBot:750, pylBot:860, kx:1520, px:1580, left:150, trxY:615, trxMerge:true };
const set=(s,x,y,side)=>{ s.x=x; s.y=y; s.side=side; };
KGL.forEach((r,i)=>{ const s=addStn(r,'kgl'); s.ki=i;
  if(i===0) return set(s,MAP.left,360,'left');
  if(i<=10) return set(s,260+(i-1)*((MAP.kx-70-260)/9),MAP.kglTop,'up');                 // Kwasa Sentral .. Muzium Negara
  if(i===14){ s.kx=MAP.kx; s.ky=MAP.trxY; return; }                           // TRX: placed by the PYL loop, KGL dot linked
  if(i<=16) return set(s,MAP.kx,[480,525,570,0,660,705][i-11],'left');         // Pasar Seni .. Maluri
  set(s,(MAP.kx-70)-(i-17)*((MAP.kx-70-260)/11),MAP.kglBot,'down');                              // Taman Pertama .. Kajang
});
PYL.forEach((r,i)=>{ const s=addStn(r,'pyl'); s.pi=i;
  if(i===0) return;                                                            // Kwasa Damansara (shared, set above)
  if(i<=14) return set(s,250+(i-1)*(1250/13),MAP.pylTop,'up');                 // Kampung Selamat .. Sentul Barat
  if(i<=20) return set(s,MAP.px,345+(i-15)*45,'right');                        // Titiwangsa .. Conlay
  if(i===21) return set(s,MAP.px,MAP.trxY,'right');                            // TRX
  if(i===22) return set(s,MAP.px,700,'right');                                 // Chan Sow Lin
  set(s,1500-(i-23)*(1350/12),MAP.pylBot,'down');                              // Kuchai .. Putrajaya Sentral
});
/* wrap a station name onto short lines, like the printed line maps */
const WRAP_FIX = { "Tun Razak Exchange (TRX)":["Tun Razak","Exchange (TRX)"], "Pusat Bandar Damansara":["Pusat Bandar","Damansara"] };
function wrapName(n,max=11){
  if(WRAP_FIX[n]) return WRAP_FIX[n];
  const ws=n.split(' '); if(ws.length===2) return ws;                         // two-word names always stack, as on the line maps
  const out=[]; let cur='';
  n.split(' ').forEach(w=>{ if(cur && (cur+' '+w).length>max){ out.push(cur); cur=w; } else cur=cur?cur+' '+w:w; });
  if(cur) out.push(cur); return out;
}
/* Train side view in local units: centred on 0, nose to +x, cab at both ends.
   Liveries (colours taken from reference photos):
   PYL - white body, red roof band and red nose, black cab mask, yellow doors, grey skirt.
   KGL - silver body, dark smoked-glass doors, teal-over-red stripe along the lower body, silver nose with black cab mask and red lights. */
const LIVERY = {
  pyl:{ body:'#F4F4F2', roof:'#E4002B', nose:'#E4002B', mask:'#1B232B', door:'#FFBB01', doorLine:'#9a7a10', skirt:'#A6A8AA', win:'#1E2D36', stripes:[], light:'#FFFFFF' },
  kgl:{ body:'#BFC4CA', roof:'#D4D8DE', nose:'#AEB3B9', mask:'#1E2226', door:'#30353B', doorLine:'#596068', skirt:'#8E949B', win:'#2E363D', stripes:[{y:3.2,h:1.1,c:'#1F8A8A'},{y:4.3,h:1.1,c:'#C8102E'}], light:'#F63E62' }
};
/* Keep the roof up: cars heading left are mirrored. On a bend between "down" and "left" the mirror is
   eased (1 → -1) so the car appears to turn round smoothly instead of snapping. */
const CAR_PITCH=56;
const TRAIN_SCALE=1;     // full-size trains
function roofY(ang){
  const a=Math.abs(ang);                                  // 0 = heading right, 180 = heading left
  if(a<=100) return 1; if(a>=170) return -1;
  const t=(a-100)/70; return Math.cos(Math.PI*(t*t*(3-2*t)));
}
function carSVG(v,lead,tail,W=52){
  const x=-W/2; let h='';
  const bx=tail?x+8:x, bw=W-(tail?8:0)-(lead?8:0);
  h+=`<rect x="${bx}" y="-10" width="${bw}" height="19" fill="${v.body}"/>`;
  h+=`<rect x="${bx}" y="-10" width="${bw}" height="3.5" fill="${v.roof}"/>`;
  h+=`<rect x="${bx}" y="5.5" width="${bw}" height="3.5" fill="${v.skirt}"/>`;
  v.stripes.forEach(st=>{ h+=`<rect x="${bx}" y="${st.y}" width="${bw}" height="${st.h}" fill="${st.c}"/>`; });
  for(const dx of [.22,.62]){ const dxp=x+W*dx; h+=`<rect x="${dxp}" y="-6" width="6.5" height="12" rx="1" fill="${v.door}"/><line x1="${dxp+3.25}" y1="-6" x2="${dxp+3.25}" y2="6" stroke="${v.doorLine}" stroke-width=".5" opacity=".8"/>`; }
  for(const wx of [.08,.4,.8]){ const wxp=x+W*wx; if((tail&&wx<.15)||(lead&&wx>.75)) continue; h+=`<rect x="${wxp}" y="-5" width="${W*.1}" height="6" rx="1" fill="${v.win}"/>`; }
  const cab=(sx,ox)=>{ const X=d=>ox+sx*d;
    return `<path d="M${X(-8)} -10 H${X(-3)} Q${X(8)} -8 ${X(9)} 3 Q${X(9)} 9 ${X(3)} 9 H${X(-8)} Z" fill="${v.nose}"/>`+
           `<path d="M${X(-7)} -8.5 H${X(-3)} Q${X(6)} -6.5 ${X(7)} 2 H${X(-7)} Z" fill="${v.mask}"/>`+
           `<rect x="${Math.min(X(4),X(6.5))}" y="3.6" width="2.5" height="1.6" rx=".6" fill="${v.light}"/>`+
           `<rect x="${Math.min(X(-8),X(-5))}" y="-6" width="3" height="12" fill="${v.body}"/>`; };
  if(lead) h+=cab(1,x+W); if(tail) h+=cab(-1,x);
  return `<g filter="drop-shadow(0 2px 2px rgba(0,0,0,.45))">${h}</g>`;
}

const annPlayer = new Audio(); let annQueue=[], annStn=null;   // announcement auto-plays when a branded station is tapped

let layOpen=null, layUnit=null, layPlan=0;
const sqft=m2=>Math.round(m2*10.7639).toLocaleString('en');
const hesc=x=>String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;');
function renderLayout(){
  const id=layOpen, s=STN[id], Y=STATION_LAYOUTS[id]; if(!s) return;
  $('#lay')?.remove();
  const d=document.createElement('div'); d.id='lay'; d.className='lay';
  let body, lvl='';
  if(!Y) body=`<p class="stnote" style="margin-top:30px">${T('lay_none')}</p>`;
  else {
    const U=Y.units.find(u=>u.id===layUnit); if(U && U.p!=null) layPlan=U.p;
    if(layPlan>=Y.plans.length) layPlan=0;
    const P=Y.plans[layPlan], n=Y.units.length+1, cols=n<=5?n:Math.ceil(n/2), rows=Math.ceil(n/cols);
    const vac=Y.units.filter(u=>!u.t), vm2=vac.reduce((a,u)=>a+(u.m2||u.sqft/10.7639),0);
    const tabs=Y.plans.length>1?`<div class="lptabs">${Y.plans.map((p,i)=>`<button class="lptab ${i===layPlan?'on':''}" data-lplan="${i}">${T('lay_plan')} ${i+1}</button>`).join('')}</div>`:'';
    let plan;
    if(P){ lvl=L(P.level);
      const maxH=Math.max(300,(Y.plans.length>1?560:620)-rows*118), sc=Math.min(1040/P.w,maxH/P.h), w=Math.round(P.w*sc), h=Math.round(P.h*sc);
      plan=`${tabs}<div class="lplan" style="width:${w}px;height:${h}px"><img src="${P.img}" alt="" style="width:${w}px;height:${h}px">${Y.units.filter(u=>u.x!=null&&(u.p||0)===layPlan).map(u=>`<span class="lmark ${u.id===layUnit?'on':''}" style="left:${u.x/P.w*100}%;top:${u.y/P.h*100}%"></span>`).join('')}</div>`;
    } else plan=`<div class="lnoplan">${ic('map')}<span>${T('lay_noplan')}</span></div>`;
    body=`${plan}<div class="lunits${cols>4?' many':''}" style="grid-template-columns:repeat(${cols},minmax(0,1fr))">${Y.units.map(u=>`<button class="lunit ${u.t?'let':'vac'}${u.id===layUnit?' on':''}${u.paid?' paid':''}" data-unit="${u.id}"><i></i><div><small>${u.id}</small><b>${u.m2?u.m2.toFixed(2)+' m²':u.sqft.toLocaleString('en')+' sq ft'}</b><em>${u.m2?'≈ '+u.sqft.toLocaleString('en')+' sq ft':'&nbsp;'}</em><strong>${u.t?hesc(u.t):T('lay_vac')}</strong></div></button>`).join('')}
        <div class="ltot"><small>${T('lay_vtot')}</small><b>${vm2.toFixed(2)} m²</b><em>≈ ${sqft(vm2)} sq ft</em><strong>${vac.length} / ${Y.units.length}</strong></div></div>
      <p class="ltap">${T('lay_tap')}${Y.units.some(u=>u.paid)?' · '+T('lay_paid'):''}${U&&U.x==null&&P?' · '+U.id+': '+T('lay_offplan'):''}</p>`;
  }
  d.innerHTML=`<button class="btn ghost lback" data-layclose>${ic('back')}<span>${T('lay_back')}</span></button>
    <div class="lhead"><div class="eyebrow">${s.name}${lvl?' · '+lvl:''}</div><h3>${T('lay_h')}</h3></div>${body}`;
  $('#panel').appendChild(d);
}
function openLayout(id){ layOpen=id; layUnit=null; layPlan=0; renderLayout(); }
function closeLayout(){ layOpen=null; layUnit=null; actOpen=null; $('#lay')?.remove(); }

/* Retailer logos: put <slug>.png (or <slug>.webp) in assets/retailers/ and it appears automatically; with no file the tile shows the name.
   slug = lower-case name, "&" -> "and", other symbols -> "-"  e.g. "7-Eleven" -> 7-eleven.png, "SPX (Shopee)" -> spx-shopee.png */
const RETAIL_LOGO_DIR="assets/retailers/";
const retailSlug=n=>n.toLowerCase().replace(/&/g,' and ').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
function stBody(s,P,ev){
  const li=a=>`<ul>${a.map(x=>`<li>${x}</li>`).join('')}</ul>`;
  if(sTab==='over'){
    if(P) return `<div class="stcols">${P.feats.length?`<div><h5>${T('st_feats')}</h5>${li(P.feats)}</div>`:''}${P.near.length?`<div><h5>${T('st_near')}</h5>${li(P.near)}</div>`:''}</div>`;
    const rows=[];
    if(s.conn.length) rows.push(`${T('st_conn')}: ${s.conn.join(' · ')}`);
    if(s.pr) rows.push(T('st_pr_yes'));
    if(s.cob) rows.push(`${T('st_cobrand')}: ${s.cob}`);
    if(RIDERSHIP[s.id]) rows.push(`${T('st_ridership')}: ${RIDERSHIP[s.id]}`);
    return `${rows.length?li(rows):''}<p class="stnote" style="margin-top:16px">${T('st_noprofile')}</p>`;
  }
  if(sTab==='brands'){
    const co=[...(s.cob?[s.cob]:[]),...((P&&P.brands)||[]).filter(b=>b!==s.cob)];
    const rt=(P&&P.retail)||[];
    let h='';
    const lay=STATION_LAYOUTS[s.id], vacBtn=(t,c='')=>`<div class="bchips" style="margin-top:18px"><button class="vacbtn${c}" data-lay="${s.id}">${ic('map')}<span>${t}</span>${ic('arrow')}</button></div>`;
    const tiles=list=>`<h5>${T('st_retail')}</h5><div class="rtiles">${list.map(b=>`<div class="rtile"><div class="rlogo"><img src="${RETAIL_LOGO_DIR}${retailSlug(b)}.png" alt="" onerror="if(!this.dataset.t){this.dataset.t=1;this.src=this.src.replace(/\\.png$/,'.webp')}else{this.parentNode.classList.add('nologo');this.remove()}"><span>${hesc(b)}</span></div><b>${hesc(b)}</b></div>`).join('')}</div>`;
    if(lay && lay.units){                       // PYL stations - tenants and vacancies from the PY retail list
      const ten=[...new Set(lay.units.filter(u=>u.t).map(u=>u.t))], nv=lay.units.filter(u=>!u.t).length;
      if(ten.length) h+=tiles(ten);
      h+= nv ? vacBtn(nv===1?T('lay_one'):T('lay_btn').replace('{n}',nv)) : vacBtn(T('lay_full'),' full');
      return h;
    }
    /* the station brand partner already shows in the panel title, so it is not repeated here */
    if(rt.length){
      const shops=rt.filter(b=>!/vacant/i.test(b)), vac=rt.filter(b=>/vacant/i.test(b));
      if(shops.length) h+=`<h5>${T('st_retail')}</h5><div class="rtiles">${shops.map(b=>`<div class="rtile"><div class="rlogo"><img src="${RETAIL_LOGO_DIR}${retailSlug(b)}.png" alt="" onerror="if(!this.dataset.t){this.dataset.t=1;this.src=this.src.replace(/\\.png$/,'.webp')}else{this.parentNode.classList.add('nologo');this.remove()}"><span>${b}</span></div><b>${b}</b></div>`).join('')}</div>`;
      if(vac.length) h+= lay ? vacBtn(T('lay_btn').replace('{n}',lay.units.length)) : vac.map(b=>{ const m=b.match(/^(\d+) vacant retail units available$/i); return vacBtn(m?T('lay_btn').replace('{n}',m[1]):b); }).join('');   // with a plan, the count comes from the plan
      else if(lay) h+=vacBtn(T('lay_btn').replace('{n}',lay.units.length));
    } else if(lay) h+=vacBtn(T('lay_btn').replace('{n}',lay.units.length));
    return h || `<p class="stnote">${T('brands_none')}</p>`;
  }
  if(sTab==='events'){
    const ab=ACT_LAYOUTS[s.id]?`<div class="bchips" style="margin:0 0 22px"><button class="vacbtn" data-act="${s.id}">${ic('map')}<span>${T('act_btn')}</span>${ic('arrow')}</button></div>`:'';
    if(!ev.length) return ab+`<p class="stnote">${T('ev_none')}</p>`;
    return ab+`<h5>${T('ev_held')}</h5><div class="evrow">${ev.slice(0,4).map(c=>`<button class="evcard" data-camp="${CAMPAIGNS.indexOf(c)}"><div class="media" style="--c:${LINES[s.lines[0]].c}">${mImg(campImg(c),'star','Campaign')}</div><b>${c.t}</b></button>`).join('')}</div>${ev.length>4?`<p class="evmore">${T('ev_more').replace('{n}',ev.length-4)}</p>`:''}`;
  }
  return '';
}

  function apply(I){                                // story step + highlight

    I.pk=I.pk.filter(p=>{ p.d+=p.v*dt; if(p.d<0||p.d>p.s.tot){ p.g.remove(); return false; }
      const [x,y]=p.s.at(p.d); p.g.setAttribute('transform',`translate(${x} ${y})`); return true; }); }

  const kick=()=>{ if(!raf) raf=requestAnimationFrame(frame); };

  function renderPanel(){
    $('#fxStory').innerHTML=`<div class="eyebrow">${T('fx_k')}</div><h2>${T('fx_h')}</h2><p class="lead">${T('fx_p')}</p>
      <div class="fx-steps">${[1,2,3].map((n,i)=>`<button class="fx-step${i===step?' on':''}" data-fxstep="${i}"><b class="n">${n}</b><div><h3>${T('fx_s'+n)}</h3><p>${T('fx_s'+n+'p')}</p></div></button>`).join('')}</div>`;
    $('#fxKpis').innerHTML=F.kpis.map(k=>`<div>${k.ic?'<b class="wic"><svg class="kic" viewBox="0 0 24 24"><circle cx="12" cy="5" r="2.5"/><circle cx="5" cy="19" r="2.5"/><circle cx="19" cy="19" r="2.5"/><path d="M12 7.5V12M5 16.5V12h14v4.5"/></svg>'+k.v+'</b>':'<b>'+k.v+'</b>'}<small>${L(k.k)}</small></div>`).join('');
    $('#fxSide').innerHTML=`<div class="eyebrow">${T('fx_who')}</div>
      <div class="fx-chips">${Object.entries(F.cats).map(([k,c])=>`<button class="fx-chip${sel===k?' on':''}" data-fxcat="${k}" style="--c:${c.c}"><i><svg viewBox="0 0 24 24">${c.ic}</svg></i><span><b>${L(c.n)}</b><small>${L(c.s)}</small></span></button>`).join('')}</div>
      <div class="eyebrow y">${T('fx_why')}</div>
      <div class="fx-why">${F.why.map(w=>`<div><i><svg viewBox="0 0 24 24">${w.ic}</svg></i><b>${L(w.t)}</b><small>${L(w.p)}</small></div>`).join('')}</div>

  }
  function setStep(i){ step=i; $$('#fxStory .fx-step').forEach((b,j)=>b.classList.toggle('on',j===i)); if(full) apply(full); }

  $('#fibre').addEventListener('click',e=>{
    const c=e.target.closest('[data-fxcat]'); if(c && !['dc','tel'].includes(c.dataset.fxcat)) return; if(c){ sel = sel===c.dataset.fxcat ? null : c.dataset.fxcat; if(step<2) setStep(2); timers.forEach(clearTimeout);
      $$('#fxSide .fx-chip').forEach(b=>b.classList.toggle('on', b.dataset.fxcat===sel)); apply(full); return; }

<!-- =====================================================================
     HOME VIDEO PLAYLIST
     Plays every video in SETTINGS.homeVideos.folder in alphabetical order,
     in a loop, with Previous / Next / Mute / Full-screen buttons.
     Add, remove or re-order videos by changing the files in that folder
     (use 01_, 02_ ... prefixes to set the order). No code change needed.
     How the folder is read (first one that works):
       1. Live folder read — kiosk launched with START-KIOSK.bat
          (Edge flag --allow-file-access-from-files). Picks up changes
          each time the home screen is shown or the playlist loops.
       2. <folder>/playlist.js — written by UPDATE-PLAYLIST.bat
          (START-KIOSK.bat runs it automatically).
       3. SETTINGS.homeVideos.fallback (single file), if set.
     ===================================================================== -->
<style>

<script>
(function(){
  const S = (typeof SETTINGS !== 'undefined') ? SETTINGS : {};
  const CFG = Object.assign({
    folder: 'home-videos/',                       // folder next to index.html
    muted: false,                                 // start muted?
    extensions: ['mp4','webm','m4v','mov','ogv'], // file types picked up
    fallback: ''                                  // optional single video if the folder is empty / unreadable
  }, S.homeVideos || {});
  if (!/\/$/.test(CFG.folder)) CFG.folder += '/';

  const vid = document.getElementById('loopVideo');
  const frame = vid && vid.closest('.video-frame');
  const attract = document.getElementById('attract');
  if (!vid || !frame || !attract) { console.warn('[home-video] video frame not found'); return; }

  let list = [], idx = 0, source = 'none', bad = new Set();
  let muted = !!CFG.muted, autoMuted = false, onHome = attract.classList.contains('active');
  let weMadeFs = false, retryT = null, scanning = null;

  vid.removeAttribute('loop'); vid.loop = false; vid.muted = muted;

  /* ---------- controls ---------- */
  const IC = {
    prev: '<svg viewBox="0 0 24 24"><path class="f" d="M19 5.5v13L9.5 12z"/><path d="M6 5.5v13"/></svg>',
    next: '<svg viewBox="0 0 24 24"><path class="f" d="M5 5.5v13L14.5 12z"/><path d="M18 5.5v13"/></svg>',
    mute: '<svg viewBox="0 0 24 24"><g class="off-muted"><path class="f" d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></g>'
        + '<g class="on-muted"><path class="f" d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></g></svg>',
    fs:   '<svg viewBox="0 0 24 24"><path class="off-max" d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>'
        + '<path class="on-max" d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/></svg>'
  };
  const bar = document.createElement('div');
  bar.className = 'hv-ctrls';
  bar.innerHTML = '<span class="hv-count" id="hvCount"></span>'
    + '<button class="hv-btn" data-hv="prev" aria-label="Previous video">' + IC.prev + '</button>'
    + '<button class="hv-btn" data-hv="next" aria-label="Next video">' + IC.next + '</button>'
    + '<button class="hv-btn" data-hv="mute" aria-label="Mute / unmute">' + IC.mute + '</button>'
    + '<button class="hv-btn" data-hv="fs" aria-label="Full screen">' + IC.fs + '</button>';
  frame.appendChild(bar);
  let awakeT = null;   // controls hidden; tapping the video shows them for 5 s
  let wasAwake = false;   // a tap on hidden buttons only reveals them, it does not press them
  frame.addEventListener('pointerdown', () => { wasAwake = frame.classList.contains('hv-awake'); frame.classList.add('hv-awake'); clearTimeout(awakeT); awakeT = setTimeout(() => frame.classList.remove('hv-awake'), 5000); }, true);
  // taps on the video or its buttons never start the kiosk journey
  ['click','pointerdown','touchstart','touchend'].forEach(ev => frame.addEventListener(ev, e => e.stopPropagation()));
  bar.addEventListener('click', e => {
    const b = e.target.closest('[data-hv]'); if (!b || !wasAwake) return;
    e.preventDefault();
    const a = b.dataset.hv;
    if (a === 'prev') play(idx - 1);
    else if (a === 'next') play(idx + 1);
    else if (a === 'mute') setMuted(!muted, true);
    else if (a === 'fs') setMax(!frame.classList.contains('hv-max'));
  });

  function renderState(){
    frame.classList.toggle('hv-muted', vid.muted);
    const c = document.getElementById('hvCount');
    if (c) { c.textContent = list.length ? (idx + 1) + ' / ' + list.length : ''; c.style.display = list.length > 1 ? '' : 'none'; }
  }
  function setMuted(m, byUser){
    muted = m; if (byUser) autoMuted = false;
    vid.muted = m; if (!m && onHome && vid.paused) vid.play().catch(()=>{});
    renderState();
  }
  function setMax(on){
    frame.classList.toggle('hv-max', on);
    const covers = window.innerHeight >= screen.height - 4 && window.innerWidth >= screen.width - 4;   // already full screen (Edge kiosk mode)
    if (on && !document.fullscreenElement && !covers && document.documentElement.requestFullscreen) {
      document.documentElement.requestFullscreen().then(() => { weMadeFs = true; }).catch(()=>{});
    } else if (!on && weMadeFs && document.fullscreenElement) {
      weMadeFs = false; document.exitFullscreen().catch(()=>{});
    }
  }
  document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && weMadeFs) { weMadeFs = false; frame.classList.remove('hv-max'); } });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && frame.classList.contains('hv-max')) setMax(false); });

  function unlock(e){
    if (e.target.closest && e.target.closest('.hv-ctrls')) return;
    if (autoMuted) { autoMuted = false; setMuted(false); }
  }
  document.addEventListener('pointerdown', unlock, true);

  /* ---------- reading the folder ---------- */
  const isVideo = n => new RegExp('\\.(' + CFG.extensions.join('|') + ')$', 'i').test(n);
  const natural = (a, b) => a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' });

  function readFolder(){            // null = folder could not be read; [] = folder is empty
    return new Promise(res => {
      let done = false; const fin = v => { if (!done) { done = true; res(v); } };
      try {
        const x = new XMLHttpRequest();
        x.open('GET', CFG.folder + (location.protocol === 'file:' ? '' : '?t=' + Date.now()));
        x.timeout = 4000;
        x.onload = () => {
          const t = x.responseText || '';
          if (!t || (x.status && x.status >= 400)) return fin(null);
          const names = []; let m;
          const rowRe = /addRow\("((?:[^"\\]|\\.)*)","(?:[^"\\]|\\.)*",(\d)/g;        // Edge / Chrome folder page
          while ((m = rowRe.exec(t))) if (m[2] === '0') { try { names.push(JSON.parse('"' + m[1] + '"')); } catch (e) { names.push(m[1]); } }
          if (!/addRow\(/.test(t)) {                                                   // web-server folder page
            const hrefRe = /href\s*=\s*["']([^"'?#]+)["']/gi;
            while ((m = hrefRe.exec(t))) { try { const n = decodeURIComponent(m[1]).split('/').filter(Boolean).pop(); if (n) names.push(n); } catch (e) {} }
          }
          fin([...new Set(names)]);
        };
        x.onerror = x.ontimeout = () => fin(null);
        x.send();
      } catch (e) { fin(null); }
      setTimeout(() => fin(null), 5000);
    });
  }
  function readPlaylistJs(){
    return new Promise(res => {
      try { delete window.HOME_PLAYLIST; } catch (e) { window.HOME_PLAYLIST = undefined; }
      const s = document.createElement('script');
      s.src = CFG.folder + 'playlist.js?t=' + Date.now();
      const fin = v => { s.remove(); res(v); };
      s.onload = () => fin(Array.isArray(window.HOME_PLAYLIST) ? window.HOME_PLAYLIST.map(String) : null);
      s.onerror = () => fin(null);
      document.head.appendChild(s);
    });
  }
  async function scan(){
    let names = await readFolder(), src = 'live folder';
    if (!names || !names.some(isVideo)) {                 // folder unreadable, or a web-server page with no recognisable video links (e.g. Android local server)
      const pl = await readPlaylistJs();
      if (pl && pl.some(isVideo)) { names = pl; src = 'playlist.js'; }
    }
    let urls = (names || []).filter(isVideo).sort(natural).map(n => CFG.folder + encodeURIComponent(n));
    if (!urls.length && CFG.fallback) { urls = [CFG.fallback]; src = 'fallback'; }
    if (!urls.length) src = names === null ? 'folder not readable' : 'folder empty';
    return { urls, src };
  }
  function refresh(startAt){        // re-read the folder, keep playing the current video if it is still there
    if (scanning) return scanning;
    scanning = scan().then(r => {
      scanning = null;
      const cur = list[idx], changed = r.urls.join('|') !== list.join('|');
      list = r.urls; source = r.src;
      if (changed) { bad.clear(); console.log('[home-video] ' + list.length + ' video(s) from ' + source, list.map(decodeURIComponent)); }
      if (Array.isArray(S.loopPlaylist)) S.loopPlaylist = list.slice();   // Commercial QA panel
      const k = list.indexOf(cur);
      if (!list.length) { noVideo(true); retryLater(); return; }
      if (startAt !== undefined) play(startAt);
      else if (k >= 0) { idx = k; vid.loop = list.length === 1; if (onHome && vid.paused) resume(); renderState(); }
      else play(0);
    });
    return scanning;
  }
  function retryLater(){ clearTimeout(retryT); retryT = setTimeout(() => { if (onHome) refresh(); else retryLater(); }, 30000); }

  /* ---------- playback ---------- */
  function noVideo(on){
    attract.classList.toggle('novideo', on);
    frame.classList.toggle('hv-none', on);
    vid.style.visibility = on ? 'hidden' : 'visible';
    if (on) { frame.classList.remove('hv-max'); vid.removeAttribute('src'); vid.load(); }
  }
  function resume(){
    if (!onHome) return;
    vid.muted = muted;
    const p = vid.play();
    if (p && p.catch) p.catch(() => {                    // autoplay with sound blocked -> play muted
      if (!vid.muted) { vid.muted = true; autoMuted = !muted; renderState(); vid.play().catch(()=>{}); }
    });
    renderState();
  }
  function play(i){
    if (!list.length) return;
    idx = ((i % list.length) + list.length) % list.length;
    const src = list[idx];
    vid.loop = list.length === 1;
    if (vid.getAttribute('src') !== src) vid.src = src; else vid.currentTime = 0;
    resume();
  }
  vid.addEventListener('loadeddata', () => { bad.delete(list[idx]); noVideo(false); renderState(); });
  vid.addEventListener('ended', () => {
    if (list.length <= 1) return;
    if (idx + 1 >= list.length) refresh(0);              // end of the playlist: re-read the folder, start again from the first
    else play(idx + 1);
  });
  vid.addEventListener('error', () => {
    const src = vid.getAttribute('src'); if (!src) return;
    console.warn('[home-video] cannot play', decodeURIComponent(src));
    bad.add(src);
    if (bad.size >= list.length) { noVideo(true); retryLater(); return; }
    setTimeout(() => play(idx + 1), 300);
  });

  /* ---------- called by show() when the screen changes ---------- */
  function onScreen(id){
    onHome = (id === 'attract');
    if (onHome) refresh();
    else { vid.pause(); if (frame.classList.contains('hv-max')) setMax(false); }
  }

  window.HomeVideo = { onScreen, refresh, next: () => play(idx + 1), prev: () => play(idx - 1),
    status: () => ({ folder: CFG.folder, source, count: list.length, playing: list[idx] ? decodeURIComponent(list[idx]) : '', files: list.map(decodeURIComponent), unplayable: [...bad].map(decodeURIComponent) }) };
  renderState();
  refresh();
})();
</script>

</html>
